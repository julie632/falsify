[project]
name = "falsify-lab"
version = "0.1.0"
description = "A small, auditable lab for checking scientific evaluation claims"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "omnigent==0.16.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
